user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                      'rt=$request_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    server_tokens       off;

    # ------------------------------------------------------------------
    # 限流（按来源 IP 分桶）。
    #   api_all    ：业务接口通用档，正常点餐节奏远够用，挡脚本与爬虫
    #   auth_login ：登录接口严格档，压住暴力试密码与 wx.login 刷量
    # 注意：小程序 dev 模式直连 8080 不走 nginx，限流只在生产链路上生效。
    # ------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr  zone=api_all:10m    rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=auth_login:10m rate=1r/s;
    # 被限的请求返回 429 而不是默认的 503，客户端文案语义更准
    limit_req_status 429;

    # 图片上传最大 5MB，这里留一点余量
    client_max_body_size 8m;

    gzip              on;
    gzip_min_length   1024;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
