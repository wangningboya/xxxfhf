# =============================================================================
# 站点配置（HTTP）
#
# 路径约定：
#   /api/**     -> 应用（去掉 /api 前缀后转发，故后端接口本身不带 /api）
#   /upload/**  -> 本地图片目录，Nginx 直出不经过应用
#
# 上线 HTTPS 后：把本文件里的 80 段改成 301 跳转，并启用 https.conf
# =============================================================================

upstream meal_app {
    # app 是宿主机上的 jar（start-app.sh 启动），不在 compose 里，主机名 app: 已不存在
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # 反代公共头放在 server 级：/api/ 与登录接口的精确 location 都能继承
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 安全头（HTTPS 上线后再加上 HSTS）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # ---------- 限流拒绝（429）的响应体 ----------
    # 这里的 429 只是 nginx 自己按 IP 限流产生的（limit_req，状态码见 nginx.conf 的
    # limit_req_status）。默认它返回一段 nginx 自带的 HTML，客户端解析不出 message，
    # 用户看到的就是「服务暂时不可用」，与实际原因不符。所以改成统一 JSON。
    #
    # 写法上有两个坑，改错会直接 500：
    #   1. 命名 location 里必须 return 200，不能 return 429。
    #      对外状态码由上面的 "=429" 指定；若这里再 return 429，会重新命中这条
    #      error_page，nginx 报 "rewrite or internal redirection cycle"。
    #   2. 不要试图拦截应用层返回的 429。
    #      proxy_intercept_errors 默认 off，上游的 429（带自己的 JSON）会原样透传，
    #      这正是需要的 —— 应用层的限额文案比这里更具体。若开启该指令，应用的 429
    #      会被替换成本段文案，"失败次数过多，账号已锁定"这类提示就丢了。
    error_page 429 =429 @rate_limited;

    location @rate_limited {
        # 中文文案必须声明 utf-8，否则部分客户端按 latin-1 解出乱码
        default_type "application/json; charset=utf-8";
        return 200 '{"code":42901,"message":"请求过快，请刷新后再试","data":null}';
    }

    # ---------- 图片：直接读共享卷 ----------
    location /upload/ {
        alias /data/upload/;
        # 不让搜索引擎收录：证照图属于公开公示，但不需要出现在图片搜索里
        add_header X-Robots-Tag "noindex" always;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---------- 登录接口：严格档限流，压暴力试密码 / 刷登录 ----------
    # 精确匹配优先于 /api/ 前缀。
    # burst=20 而不是 5：限流 key 是来源 IP，群里一桌人连同一个 WiFi 就是同一个桶。
    # 发邀请码那天一群人在店里同时点开小程序，5 个的余量会直接误伤；
    # 稳态仍是 1 r/s，脚本刷登录照样挡得住。
    location = /api/auth/login {
        limit_req zone=auth_login burst=20 nodelay;
        proxy_pass http://meal_app/auth/login;
    }

    location = /api/auth/admin/login {
        limit_req zone=auth_login burst=20 nodelay;
        proxy_pass http://meal_app/auth/admin/login;
    }

    # ---------- 业务接口 ----------
    location /api/ {
        limit_req zone=api_all burst=100 nodelay;
        proxy_pass http://meal_app/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
    }

    # ---------- 健康检查（宿主机 curl 用） ----------
    location = /health {
        proxy_pass http://meal_app/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://meal_app/ready;
        access_log off;
    }

    # ---------- 网页后台（Vue 3 + hash 路由） ----------
    # 构建产物 admin/dist 由 compose 挂到 /data/admin；hash 路由不需要 rewrite 到子路径
    location /admin/ {
        alias /data/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        expires -1;
    }

    # ---------- 其余一律 404，不暴露目录 ----------
    location / {
        return 404;
    }
}
