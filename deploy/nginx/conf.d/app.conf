# =============================================================================
# 站点配置（HTTP）
#
# 路径约定：
#   /api/**     -> 应用（去掉 /api 前缀后转发，故后端接口本身不带 /api）
#   /upload/**  -> 本地图片目录，Nginx 直出不经过应用
#
# 上线 HTTPS 后：把本文件里的 80 段改成 301 跳转，并启用 https.conf
# =============================================================================

upstream meal_app {
    server app:8080;
    keepalive 32;
}

server {
    listen       80;
    server_name  _;

    # 安全头（HTTPS 上线后再加上 HSTS）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer-when-downgrade always;

    # ---------- 图片：直接读共享卷 ----------
    location /upload/ {
        alias /data/upload/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---------- 业务接口 ----------
    location /api/ {
        proxy_pass http://meal_app/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    60s;
    }

    # ---------- 健康检查（宿主机 curl 用） ----------
    location = /health {
        proxy_pass http://meal_app/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://meal_app/ready;
        access_log off;
    }

    # ---------- 网页后台（Vue 3 + hash 路由） ----------
    # 构建产物 admin/dist 由 compose 挂到 /data/admin；hash 路由不需要 rewrite 到子路径
    location /admin/ {
        alias /data/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        expires -1;
    }

    # ---------- 其余一律 404，不暴露目录 ----------
    location / {
        return 404;
    }
}
