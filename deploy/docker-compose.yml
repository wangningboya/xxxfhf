# =============================================================================
# Docker Compose：mysql（单台云服务器）
#
# 用法：
#   1. cp .env.example .env 并填好密码
#   2. docker compose up -d
#   3. docker compose ps          # mysql 应为 healthy/running
#
# 说明：
#   - mysql 端口只绑定 127.0.0.1，供宿主机上的服务连接，不对外暴露
#   - nginx 已在宿主机安装；app 以 jar 包形式在宿主机运行，均不由 compose 管理
# =============================================================================

name: meal-order

services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-meal_order}
      MYSQL_USER: ${MYSQL_USER:-meal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      # 仅在数据卷为空（首次启动）时执行，重复启动不会重跑
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  mysql-data:
