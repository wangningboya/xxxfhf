# =============================================================================
# 公共配置：dev 与 prod 都一样的东西放这里
#
#   环境差异全部在 application-dev.yml / application-prod.yml，本文件不出现
#   任何「只在某一环境成立」的值（数据库地址、日志级别、跨域来源等）。
#
#   激活方式：环境变量 SPRING_PROFILES_ACTIVE=dev|prod
#     - 默认 dev：本地 IDE 或 mvn spring-boot:run 直接能跑
#     - 镜像里强制 prod：Dockerfile 有 ENV SPRING_PROFILES_ACTIVE=prod，
#       docker-compose 再显式传一次。生产漏配也绝不会落回 dev。
# =============================================================================

server:
  port: 8080
  shutdown: graceful
  # 不暴露任何额外错误细节
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: meal-order
  profiles:
    # 没显式指定时按 dev 跑。生产靠 Dockerfile/compose 覆盖，不靠这里
    active: ${SPRING_PROFILES_ACTIVE:dev}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      # 压缩在服务端做，这里要容得下原图；与 app.upload.max-size-mb 保持一致
      max-file-size: 15MB
      max-request-size: 16MB

  # 连接池参数两个环境一致，差异只在 url/账号密码（见 dev/prod 文件）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: meal-hikari
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      # 主键统一数据库自增 BIGINT，与建表脚本的 AUTO_INCREMENT 一致
      id-type: auto

app:
  jwt:
    expire-days: ${APP_JWT_EXPIRE_DAYS:7}
  wx:
    code2session-url: https://api.weixin.qq.com/sns/jscode2session
    timeout-seconds: 5
  upload:
    url-prefix: /upload
    # 原图上限：手机直出的高清图常在 8~12MB
    max-size-mb: ${APP_UPLOAD_MAX_SIZE_MB:15}
    # 压缩后长边（px）：小程序最大展示位 3x 屏约 1035px
    max-edge: ${APP_UPLOAD_MAX_EDGE:1200}
    # JPEG 质量（0~1）
    jpeg-quality: ${APP_UPLOAD_JPEG_QUALITY:0.82}
  schedule:
    # 每 5 分钟；要更精确改 0 * * * * *
    prepay-release-cron: "${APP_PREPAY_RELEASE_CRON:0 */5 * * * *}"
    # 取消申请超时自动同意扫描，默认每 10 分钟
    cancel-request-cron: "${APP_CANCEL_REQUEST_CRON:0 */10 * * * *}"
    # 站内消息清理（删除 90 天前的消息），默认每天 03:30
    message-cleanup-cron: "${APP_MESSAGE_CLEANUP_CRON:0 30 3 * * *}"
    enabled: ${APP_SCHEDULE_ENABLED:true}
  admin:
    # 商家初始账号：库里没有该 username 时创建一次，已存在则不覆盖
    init-username: ${APP_ADMIN_USERNAME:admin}
    init-password: ${APP_ADMIN_PASSWORD:admin}
    init-enabled: ${APP_ADMIN_INIT_ENABLED:true}

logging:
  # 文件输出与滚动策略统一由 logback-spring.xml 控制，此处不再重复配置
  level:
    root: INFO
