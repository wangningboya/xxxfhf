# =============================================================================
# 生产环境（Dockerfile ENV + docker-compose 双重强制，不依赖人工记得设）
#
#   与 dev 的三处硬差异：
#     1. 数据库 url / 账号 / 密码、JWT 密钥、微信凭据 **都不给默认值**。
#        ${APP_DB_PASSWORD:} 这种写法会把「忘配」变成「用空密码连上了」，
#        必须让它在启动时直接失败（Could not resolve placeholder），
#        而不是安静地跑起来。
#     2. SQL 不进日志。订单、手机号都在 SQL 参数里，日志等于明文泄露。
#     3. 不注册 CORS。生产前后端同域反代（Nginx /api/** → app），不需要跨域。
# =============================================================================

server:
  # 只监听回环，不对外开 8080。
  #
  # nginx 与本应用同机（upstream 见 deploy/nginx/conf.d/app.conf），从 127.0.0.1 转发即可，
  # 业务不受影响。绑回环是为了让「来源 IP」可信：限流按 X-Real-IP 归配额，而这个头只有 nginx
  # 覆盖写入时才可信；若 8080 公网可达，客户端自带一个 X-Real-IP 就能每次换桶，L2 形同虚设。
  #
  # 两个前提：
  #   1. upstream 必须写 127.0.0.1（不能写 localhost）—— localhost 可能解析到 ::1，
  #      本配置只监听 IPv4 回环，会变成 502。
  #   2. 若将来 app 也搬进 compose，容器内的回环不是宿主机，upstream 要用容器名，
  #      那时需改为绑容器 IP 或用网络隔离，不能再绑 127.0.0.1。
  #
  # 代价：本地直连 公网IP:8080 不再可达，排查时用 ssh -L 8080:127.0.0.1:8080 转发。
  address: 127.0.0.1

spring:
  datasource:
    url: ${APP_DB_URL}
    username: ${APP_DB_USER}
    password: ${APP_DB_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.xxxfhf.meal: INFO

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  wx:
    app-id: ${APP_WX_APP_ID}
    app-secret: ${APP_WX_APP_SECRET}
  upload:
    dir: ${APP_UPLOAD_DIR:/data/upload}
  web:
    # 空列表 = WebMvcConfig 里直接 return，不注册任何 CORS 映射。
    # 留空而不是删掉这行：删了会落回 AppProperties 的类默认值 localhost:5173。
    allowed-origins: []
